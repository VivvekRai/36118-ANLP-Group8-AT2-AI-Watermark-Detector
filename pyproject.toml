[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-watermark-detector"
version = "0.1.0"
description = "Green/red-list AI text watermarking generator and detector (Group 13 -- Pathfinder)"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["src", "src.watermark"]